# General settings
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 7200 # 5 days
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600 # 90 days
verifyDepsBeforeRun: error

allowBuilds:
  "core-js": false
  "esbuild@0.28.2": true

trustPolicyExclude:
  # https://github.com/microsoft/beachball/issues/1410
  - "beachball@2.65.6"
  # https://github.com/vercel/vercel/issues/17408
  - "@vercel/detect-agent@1.2.5"
  # https://github.com/webpack/webpack-dev-middleware/issues/2407
  - "webpack-dev-middleware@7.4.6"

overrides:
  esbuild: 0.28.2

# Workspace

packages:
  - packages/*
  - demos/*
  - docs-website

versioning:
  ignore:
    - "@spautz/package-template-*"
  changelog:
    format: github
    storage: repository

catalogs:
  # Shared = aligned between packages and demos
  # (There are some dependencies in common between packages/demos which are not aligned)
  shared:
    '@testing-library/jest-dom': 7.0.1
    '@testing-library/react': 16.3.2
    '@vitest/coverage-v8': 4.1.11
    '@vitest/ui': 4.1.11
    vite: 8.2.2
    vitest: 4.1.11
  # Packages use (mostly) up-to-date dependencies and devDependencies
  packages:
    '@arethetypeswrong/cli': 0.18.5
    '@size-limit/esbuild': 13.0.3
    '@size-limit/esbuild-why': 13.0.3
    '@size-limit/file': 13.0.3
    '@types/node': 24.13.3
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.5
    publint: 0.3.24
    react: 19.2.8
    react-dom: 19.2.8
    size-limit: 13.0.3
    tsdown: 0.22.14
    typescript: 7.0.2
  # Demo apps sometimes use older dependencies and devDependencies
  demos:
    '@types/node': 24.13.3
    '@types/react': 19.2.18
    '@types/react-dom': 19.2.5
    react: 19.2.8
    react-dom: 19.2.8
    source-map-explorer: 2.5.3
    vite: 8.2.2

  # Library-specific catalogs help with isolated testing:
  # these are generally not used for normal dev
  react16:
    '@types/react': ^16.9.0
    '@types/react-dom': ^16.9.0
    react: ^16.9.0
    react-dom: ^16.9.0
  react17:
    '@types/react': ^17.0.0
    '@types/react-dom': ^17.0.0
    react: ^17.0.2
    react-dom: ^17.0.2
  react18:
    '@types/react': ^18.0.0
    '@types/react-dom': ^18.0.0
    react: ^18.2.0
    react-dom: ^18.2.0
  react19:
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
    react: ^19.2.8
    react-dom: ^19.2.8
  typescriptLTS:
    # https://github.com/DefinitelyTyped/DefinitelyTyped#support-window
    typescript: 5.6.3
